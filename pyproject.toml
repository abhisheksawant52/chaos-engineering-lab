[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chaos-engineering-lab"
version = "0.1.0"
description = "A library of Litmus and Chaos Mesh experiments plus a Python runner with steady-state hypotheses"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abhishek Sawant" }]
keywords = ["chaos-engineering", "litmus", "chaos-mesh", "kubernetes", "resilience"]
dependencies = [
    "click>=8.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "kubernetes>=29.0",
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "black>=24.0", "pre-commit>=3.7"]

[project.scripts]
chaos-lab = "chaos_lab.cli:main"

[project.urls]
Homepage = "https://github.com/abhisheksawant52/chaos-engineering-lab"
Issues = "https://github.com/abhisheksawant52/chaos-engineering-lab/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
